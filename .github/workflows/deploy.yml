name: Build the site branch

# Every push to main builds the public website into the `site` branch: only the files a browser
# needs, plus the two offline copies. Hostinger's Git deployment pulls the `site` branch into
# public_html. A version tag (v*) also publishes the offline copies as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test before publishing
        run: |
          python3 tools/test-data.py
          python3 tools/check-text.py
          for f in js/*.js; do node --check "$f"; done
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/jsdom" jsdom@24.1.3
          NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node test/smoke-test.js

      - name: Assemble the site
        run: |
          set -e
          mkdir -p dist
          cp index.html about.html questions.html 404.html favicon.svg robots.txt sitemap.xml .htaccess dist/
          cp -r css js data vendor dist/
          cp LICENSE LICENSE-DATA.md DATA-SOURCES.md dist/
          python3 build-standalone.py --out dist
          echo "Built from ${GITHUB_SHA}" > dist/BUILD.txt
          # Version the script and style links so a deploy reaches returning visitors at once.
          sed -i -E "s#(src|href)=\"(js|css)/([a-z-]+)\.(js|css)\"#\1=\"\2/\3.\4?v=${GITHUB_SHA::8}\"#g" dist/index.html
          grep -c "?v=${GITHUB_SHA::8}" dist/index.html
          du -sh dist

      - name: Publish to the site branch
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd dist
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Build on top of the previous site commit so the host can fast-forward its pull.
          if git fetch -q --depth 1 origin site; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          if git diff --cached --quiet; then echo "Site unchanged"; exit 0; fi
          git commit -q -m "Site build from ${GITHUB_SHA}"
          git push -q origin HEAD:site

      - name: Attach offline copies to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/bottom-truth-offline.html dist/bottom-truth-offline-lite.html \
            --title "Bottom Truth ${GITHUB_REF_NAME}" \
            --notes "Offline copies of the map. Open either file in a browser; no server needed. Base maps need a connection. Not legal advice. Not for navigation. Changes: see CHANGELOG.md." \
            || gh release upload "${GITHUB_REF_NAME}" dist/bottom-truth-offline.html dist/bottom-truth-offline-lite.html --clobber
